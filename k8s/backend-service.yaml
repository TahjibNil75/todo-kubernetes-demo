apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: todo-app   # ← must match your namespace
spec:
  type: ClusterIP       # internal service (used by frontend or ingress)

  selector:
    app: backend        # ← must match backend Deployment labels

  ports:
  - port: 8000          # service port inside cluster
    targetPort: 8000    # container port (uvicorn)
    protocol: TCP