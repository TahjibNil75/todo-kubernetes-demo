apiVersion: v1
kind: Service
metadata:
  name: postgres-service            # ← This is the DNS name other pods use
  namespace: todo-app
spec:
  type: ClusterIP                   # Internal only (not accessible from internet)
  clusterIP: None                   # Headless service for StatefulSet
  selector:
    app: postgres                   # ← Must match StatefulSet pod labels
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP